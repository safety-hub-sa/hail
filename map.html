<style>
:root{
  --bg:#E7EEF1; --surface:#FFFFFF; --surface-2:#F2F6F8; --ink:#0E2233; --muted:#5B6B78; --line:#D3DDE2;
  --brand:#0097B9; --brand-ink:#00566B; --brand-soft:#DDF2F7;
  --iso-red:#C8102E; --iso-green:#00843D; --iso-yellow:#F6B40E; --iso-blue:#005387; --slate:#4A5A66; --navy:#16325C;
  --shadow:0 6px 24px rgba(14,34,51,.14);
  --plan-filter:none;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1820; --surface:#12232D; --surface-2:#1A2F3B; --ink:#E4EDF1; --muted:#97A9B4; --line:#28404D;
    --brand:#38C3E1; --brand-ink:#9FE3F2; --brand-soft:#123744;
    --shadow:0 6px 24px rgba(0,0,0,.45); --plan-filter:brightness(.9) contrast(1.02);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1820; --surface:#12232D; --surface-2:#1A2F3B; --ink:#E4EDF1; --muted:#97A9B4; --line:#28404D;
  --brand:#38C3E1; --brand-ink:#9FE3F2; --brand-soft:#123744;
  --shadow:0 6px 24px rgba(0,0,0,.45); --plan-filter:brightness(.9) contrast(1.02);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* ---------- map ---------- */
#map{position:fixed;inset:0;overflow:hidden;touch-action:none;direction:ltr;background:var(--bg);user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#stage.anim{transition:transform .38s cubic-bezier(.2,.7,.2,1)}
#stage img.base{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none;border-radius:6px}
#stage img.plan{filter:var(--plan-filter);background:#fff}
#stage img.sat{border-radius:10px}
#zonesvg{position:absolute;inset:0;width:100%;height:100%}
#zonesvg .zp{cursor:pointer;transition:fill-opacity .2s}
#zonesvg .zp:hover{fill-opacity:.32}
.zlabel{position:absolute;transform:translate(-50%,-50%) scale(var(--k,1));background:var(--surface);color:var(--ink);border:0;border-radius:999px;padding:7px 14px 7px 12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);white-space:nowrap;display:flex;gap:8px;align-items:center;direction:rtl}
html[dir="ltr"] .zlabel{direction:ltr}
.zlabel i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* markers: ISO 7010 sign families */
.mk{position:absolute;width:0;height:0;border:0;padding:0;background:none}
.mk .s{position:absolute;left:0;top:0;width:26px;height:26px;transform:translate(-50%,-50%) scale(var(--k,1));display:grid;place-items:center;color:#fff;font-weight:700;font-size:10px;line-height:1;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 2px 6px rgba(0,0,0,.35);border:1.5px solid #fff;letter-spacing:0}
.mk .s svg{width:16px;height:16px}
.mk[data-c="fe"] .s,.mk[data-c="fh"] .s{background:var(--iso-red);border-radius:4px}
.mk[data-c="ex"] .s,.mk[data-c="ap"] .s,.mk[data-c="safe"] .s{background:var(--iso-green);border-radius:4px}
.mk[data-c="cam"] .s{background:var(--iso-blue);border-radius:50%}
.mk[data-c="gate"] .s{background:var(--navy);border-radius:50%;font-size:12px}
.mk .s .ty{position:absolute;top:-7px;inset-inline-start:-8px;font-style:normal;font-size:8px;font-weight:700;line-height:1;padding:2px 3px;border-radius:4px;background:#fff;color:#C8102E;border:1px solid #C8102E;direction:ltr}
.mk .s .ty.H{background:#14284A;color:#fff;border-color:#fff}
.tag.loc{direction:rtl}
.mk[data-c="fac"] .s{background:var(--slate);border-radius:50%;font-size:9px}
.mk[data-c="fac"] .s svg{width:15px;height:15px}
.mk[data-c="crit"] .s{background:none;border:0;box-shadow:none;width:30px;height:28px}
.mk[data-c="crit"] .s svg{width:30px;height:28px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
#stage.far .mk .s{width:13px;height:13px;border-width:1.5px}
#stage.far .mk .s>*{display:none}
#stage.far .mk[data-c="crit"] .s{width:15px;height:14px}
#stage.far .mk[data-c="crit"] .s>svg{display:block;width:15px;height:14px}
#stage.far .mk[data-c="crit"] .s text{display:none}
.mk.dim{opacity:.0;pointer-events:none}
.mk.sel{z-index:5}
.mk.sel .s{outline:3px solid var(--brand);outline-offset:3px}
.mk.sel::after{content:"";position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;border:3px solid var(--brand);transform:translate(-50%,-50%) scale(var(--k,1));animation:ping 1.6s ease-out infinite;pointer-events:none}
@keyframes ping{0%{opacity:.9;transform:translate(-50%,-50%) scale(calc(var(--k,1)*.6))}100%{opacity:0;transform:translate(-50%,-50%) scale(calc(var(--k,1)*1.8))}}
@media (prefers-reduced-motion:reduce){#stage.anim{transition:none}.mk.sel::after{animation:none}}

/* ---------- chrome ---------- */
.ui{position:fixed;z-index:10}
#top{top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline:12px;display:flex;gap:10px;align-items:flex-start}
.brand{flex:1;min-width:0;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:10px 14px}
.brand img{width:46px;height:auto;flex:none;background:#fff;border-radius:8px;padding:2px}
.brand h1{margin:0;font-size:16px;line-height:1.3;font-weight:700;color:var(--ink)}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.35}
.tools{display:flex;flex-direction:column;gap:8px}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-weight:700;font-size:13px}
.ib svg{width:20px;height:20px}

#float{bottom:0;inset-inline:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#float>*{pointer-events:auto}
.seg{display:flex;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink)}

#panel{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);inset-inline:12px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:10px;max-width:640px;margin-inline:auto}
@media (min-width:700px){#panel{inset-inline:auto;width:620px;left:50%;transform:translateX(-50%)}}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:0 12px;border:1px solid var(--line)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;height:44px;font:inherit;font-size:15px;color:var(--ink);outline:none}
.search input::placeholder{color:var(--muted)}
.search .clr{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px;display:none}
.search.has .clr{display:block}
#results{max-height:38vh;overflow:auto;display:none;margin:-2px 0 0;padding:0;list-style:none;border-bottom:1px solid var(--line)}
#results.on{display:block}
#results li button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:9px 4px;text-align:start}
#results li+li button{border-top:1px solid var(--line)}
#results .t{font-weight:600;font-size:14px}
#results .z{font-size:12px;color:var(--muted)}
#results .empty{padding:12px 4px;color:var(--muted);font-size:14px}
.chipicon{position:relative;width:26px;height:26px;flex:none}
.chipicon .mk{position:absolute;left:13px;top:13px}

.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.tabs button{border:0;background:none;border-radius:9px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted);line-height:1.25}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(14,34,51,.15)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 1px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 8px;font-size:13px;font-weight:500;white-space:nowrap}
html[dir="ltr"] .chip{padding:5px 8px 5px 12px}
.chip b{font-weight:700;color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.chip[aria-pressed="true"] b{color:var(--brand-ink)}
.chip .chipicon{width:20px;height:20px}
.chip .chipicon .mk{left:10px;top:10px}
.chip .chipicon .mk .s{--k:.72}
.hint{font-size:13px;color:var(--muted);margin:0;padding:2px 4px;line-height:1.5}

/* ---------- item sheet ---------- */
#sheet{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);inset-inline:12px;background:var(--surface);border-radius:18px;box-shadow:0 10px 40px rgba(14,34,51,.3);padding:16px;display:none;max-width:640px;margin-inline:auto;z-index:20}
@media (min-width:700px){#sheet{inset-inline:auto;width:620px;left:50%;transform:translateX(-50%)}}
#sheet.on{display:block}
.sh-head{display:flex;gap:14px;align-items:center}
.sh-sign{position:relative;width:52px;height:52px;flex:none}
.sh-sign .mk{position:absolute;left:26px;top:26px}
.sh-sign .mk .s{--k:1.9}
.sh-title{flex:1;min-width:0}
.sh-title h2{margin:0;font-size:18px;font-weight:700;line-height:1.3}
.sh-title .en{margin:2px 0 0;font-size:14px;color:var(--muted);direction:ltr;text-align:start}
html[dir="rtl"] .sh-title .en{text-align:right}
.sh-close{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:10px;font-size:20px;line-height:1;flex:none}
.sh-meta{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px}
.tag{font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 9px}
.tag.code{font-weight:700;direction:ltr;unicode-bidi:isolate}
.sh-nav{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:600;font-size:14px;background:var(--surface-2);color:var(--ink)}
.btn.pri{background:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#04222B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#04222B}}
.btn[disabled]{opacity:.4}
.sh-count{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.tourbtn{display:flex;align-items:center;gap:7px;border:0;background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px 10px 12px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.tourbtn svg{width:16px;height:16px}
#stage.slow{transition:transform 1.1s cubic-bezier(.45,.05,.2,1)}
#gtcard{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);inset-inline:12px;max-width:520px;margin-inline:auto;background:var(--surface);border-radius:18px;box-shadow:0 10px 40px rgba(14,34,51,.3);padding:14px;display:flex;flex-direction:column;gap:10px;z-index:25}
#gtcard[hidden]{display:none}
@media (min-width:700px){#gtcard{inset-inline:auto;width:500px;left:50%;transform:translateX(-50%)}}
.gt-row{display:flex;align-items:center;gap:8px}
.gt-tx{flex:1;min-width:0}.gt-tx b{display:block;font-size:17px;line-height:1.35}.gt-tx span{display:block;font-size:13px;color:var(--muted)}
.gt-bar{height:4px;background:var(--surface-2);border-radius:9px;overflow:hidden}.gt-bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .6s}
#gt-pp svg{width:16px;height:16px;display:block}
#gtcard .btn{min-width:44px;font-size:14px;line-height:1.2}
body.touring #panel,body.touring #float,body.touring #sheet{visibility:hidden}
@media (prefers-reduced-motion:reduce){#stage.slow{transition:none}}
#stage svg.model{display:block;width:100%;height:100%;pointer-events:none;position:absolute;inset:0}
:root[data-theme="dark"] #stage svg.model{filter:brightness(.86)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #stage svg.model{filter:brightness(.86)}}
#stage.iso .mk .s{transform:translate(-50%,-50%) translateY(-14px) scale(var(--k,1))}
#stage.iso .mk::before{content:"";position:absolute;left:-1px;top:-9px;width:2px;height:9px;background:#fff;box-shadow:0 0 2px rgba(0,0,0,.45);transform:scale(var(--k,1));transform-origin:50% 100%}
#stage.iso.far .mk .s{transform:translate(-50%,-50%) translateY(-9px) scale(var(--k,1))}
#stage.iso.far .mk::before{height:6px;top:-6px}
.blabel{position:absolute;transform:translate(-50%,-100%) translateY(-6px) scale(var(--k,1));transform-origin:50% 100%;background:rgba(255,255,255,.95);color:#14284A;border:0;border-radius:999px;padding:5px 12px;font-family:inherit;font-weight:600;font-size:13px;line-height:1.2;white-space:nowrap;box-shadow:0 3px 10px rgba(20,40,74,.18);pointer-events:none;z-index:1}
#stage.far .blabel{font-size:11px;padding:4px 9px}
#stage.far .blabel.minor{display:none}
.blabel.go{background:#14284A;color:#fff;pointer-events:auto;cursor:pointer}

.attrib{position:fixed;z-index:5;font-size:10px;color:#fff;text-shadow:0 1px 2px #000;opacity:.85;pointer-events:none;display:none}
.attrib.on{display:block}
</style>
</head>

const ISO=(()=>{
const PW=595.5,PH=842.25,C=Math.cos(Math.PI/6),S=Math.sin(Math.PI/6);
const P=(x,y,z=0)=>[(x*PW-y*PH)*C,(x*PW+y*PH)*S-z];
const shade=(hex,f)=>{const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const m=v=>Math.max(0,Math.min(255,Math.round(f<1?v*f:v+(255-v)*(f-1))));return "#"+((1<<24)|(m(r)<<16)|(m(g)<<8)|m(b)).toString(16).slice(1);};
const pts=a=>a.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");

function scene(){
  const flats=[],solids=[],labels=[],rfill=[],rline=[];
  const api={
    flat(poly,fill,opt={}){flats.push({poly,fill,z:opt.z||0,stroke:opt.stroke,sw:opt.sw||0,dash:opt.dash,op:opt.op});return api;},
    plinth(x0,y0,x1,y1,d,col){api.flat([[x0,y1],[x1,y1]].map(p=>p).concat([[x1,y1],[x0,y1]]),"none");

    rect(x0,y0,x1,y1,fill,opt={}){return api.flat([[x0,y0],[x1,y0],[x1,y1],[x0,y1]],fill,opt);},
    box(x0,y0,x1,y1,h,top,opt={}){solids.push({x0:Math.min(x0,x1),y0:Math.min(y0,y1),x1:Math.max(x0,x1),y1:Math.max(y0,y1),h,top,side:opt.side||top,z:opt.z||0,deco:opt.deco,shadow:opt.shadow!==false,stroke:opt.stroke});return api;},
    wall(x0,y0,x1,y1,h,col,t=0.0026){const tx=t*PH/PW;
      if(Math.abs(x1-x0)>Math.abs(y1-y0))api.box(x0,y0-t/2,x1,y0+t/2,h,col,{shadow:false});else api.box(x0-tx/2,y0,x0+tx/2,y1,h,col,{shadow:false});return api;},
    road(pts,w,fill,line,opt={}){

      for(let i=0;i<pts.length-1;i++){const a=Q(pts[i]),b=Q(pts[i+1]);const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;const nx=-dy/L*h,ny=dx/L*h;
        rfill.push({poly:[B([a[0]+nx,a[1]+ny]),B([b[0]+nx,b[1]+ny]),B([b[0]-nx,b[1]-ny]),B([a[0]-nx,a[1]-ny])],fill});}
      pts.forEach(p=>{const c=Q(p),k=[];for(let j=0;j<8;j++){const t=j*Math.PI/4+Math.PI/8;k.push(B([c[0]+Math.cos(t)*h*1.08,c[1]+Math.sin(t)*h*1.08]));}rfill.push({poly:k,fill});});
      if(line)rline.push({pts,line,dash:opt.dash||"7 6",lw:opt.lw||1.3});return api;},
    drum(x,y,r,h,opt={}){const rx=r/PW,ry=r/PH;solids.push({drum:1,x,y,r,h,z:0,x0:x-rx,y0:y-ry,x1:x+rx,y1:y+ry,shadow:true});return api;},
    tree(x,y,r=0.012){solids.push({tree:1,x,y,r,x0:x-r,y0:y-r,x1:x+r,y1:y+r,h:0,z:0});return api;},

    render(){

      const acc=p=>{minx=Math.min(minx,p[0]);maxx=Math.max(maxx,p[0]);miny=Math.min(miny,p[1]);maxy=Math.max(maxy,p[1]);};
      flats.forEach(f=>{f.poly.forEach(q=>acc(P(q[0],q[1],f.z)));if(f.side){acc(P(f.side.x1,f.side.y1,-f.side.d));}});
      solids.forEach(s=>{acc(P(s.x0,s.y0,s.z+s.h+(s.tree?30:0)));acc(P(s.x1,s.y1,0));acc(P(s.x1,s.y0,0));acc(P(s.x0,s.y1,0));});
      const pad=30;minx-=pad;miny-=pad;maxx+=pad;maxy+=pad;
      const T=(x,y,z=0)=>{const p=P(x,y,z);return [p[0]-minx,p[1]-miny];};
      let out=`<defs><pattern id="soil" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#D9C39A"/><circle cx="2" cy="3" r=".9" fill="#BFA474"/><circle cx="6.5" cy="7" r=".7" fill="#C8AF82"/><circle cx="7" cy="2" r=".5" fill="#E6D3AE"/></pattern>
<pattern id="grate" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#4E5A63"/><rect width="1.4" height="4" fill="#8FA0AB"/></pattern></defs>`;
      flats.forEach(f=>{if(f.side){const {x0,y0,x1,y1,d,col}=f.side;

        out+=`<polygon points="${pts(f.poly.map(q=>T(q[0],q[1],f.z)))}" fill="${f.fill}"${f.stroke?` stroke="${f.stroke}" stroke-width="${f.sw}"`:""}${f.dash?` stroke-dasharray="${f.dash}"`:""}${f.op!=null?` opacity="${f.op}"`:""} stroke-linejoin="round"/>`;});
      rfill.forEach(f=>{out+=`<polygon points="${pts(f.poly.map(q=>T(q[0],q[1],0)))}" fill="${f.fill}"/>`;});
      rline.forEach(l=>{out+=`<polyline points="${pts(l.pts.map(q=>T(q[0],q[1],0)))}" fill="none" stroke="${l.line}" stroke-width="${l.lw}" stroke-dasharray="${l.dash}" stroke-linejoin="round" stroke-linecap="round"/>`;});
      // shadows
      const sh=solids.filter(s=>s.shadow&&!s.tree&&!s.drum&&s.h>3);
      out+=`<g fill="#3A3226" opacity=".13">`;
      sh.forEach(s=>{const d=s.h*0.0011;const q=[[s.x0,s.y0],[s.x1,s.y0],[s.x1+d*1.6,s.y0+d*.4],[s.x1+d*1.6,s.y1+d*1.3],[s.x0+d*.4,s.y1+d*1.3],[s.x0,s.y1]];

      out+=`</g>`;
      solids.sort((a,b)=>(a.x0+a.x1)*PW+(a.y0+a.y1)*PH-((b.x0+b.x1)*PW+(b.y0+b.y1)*PH)||a.z-b.z);
      solids.forEach(s=>{
        if(s.drum){const c0=T(s.x,s.y,0),c1=T(s.x,s.y,s.h),rx=s.r*1.2247,ry=s.r*.7071;
          out+=`<ellipse cx="${c0[0]+2}" cy="${c0[1]+1}" rx="${rx}" ry="${ry}" fill="#3A3226" opacity=".18"/>`+
          `<path d="M${c1[0]-rx},${c1[1]} L${c0[0]-rx},${c0[1]} A${rx},${ry} 0 0 0 ${c0[0]+rx},${c0[1]} L${c1[0]+rx},${c1[1]} Z" fill="#8E623A"/>`+
          `<path d="M${c1[0]-rx*.82},${c1[1]+ry*.6} L${c0[0]-rx*.82},${c0[1]+ry*.4} A${rx},${ry} 0 0 0 ${c0[0]+rx*.82},${c0[1]+ry*.4} L${c1[0]+rx*.82},${c1[1]+ry*.6}" fill="#2B2F33" opacity=".85"/>`+
          `<ellipse cx="${c1[0]}" cy="${c1[1]}" rx="${rx}" ry="${ry}" fill="#C89A63" stroke="#8E623A" stroke-width=".6"/><ellipse cx="${c1[0]}" cy="${c1[1]}" rx="${rx*.58}" ry="${ry*.58}" fill="#3A3F44"/><ellipse cx="${c1[0]}" cy="${c1[1]}" rx="${rx*.2}" ry="${ry*.2}" fill="#C89A63"/>`;return;}
        if(s.tree){const c=T(s.x,s.y,0),rr=s.r*PW*1.1;
          out+=`<ellipse cx="${c[0]}" cy="${c[1]+1}" rx="${rr*1.05}" ry="${rr*.55}" fill="#3A3226" opacity=".15"/><rect x="${c[0]-1.2}" y="${c[1]-10}" width="2.4" height="10" fill="#8A6A48"/><circle cx="${c[0]}" cy="${c[1]-14}" r="${rr}" fill="#6FA35A"/><circle cx="${c[0]-rr*.3}" cy="${c[1]-14-rr*.3}" r="${rr*.55}" fill="#8DBE70"/>`;return;}
        const {x0,y0,x1,y1,h,z}=s,zt=z+h;
        const top=[T(x0,y0,zt),T(x1,y0,zt),T(x1,y1,zt),T(x0,y1,zt)];
        const front=[T(x0,y1,z),T(x1,y1,z),T(x1,y1,zt),T(x0,y1,zt)];
        const right=[T(x1,y0,z),T(x1,y1,z),T(x1,y1,zt),T(x1,y0,zt)];
        const st=s.stroke?` stroke="${s.stroke}" stroke-width=".6"`:"";

        if(s.deco)out+=s.deco(T,s);

      return {svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${(maxx-minx).toFixed(0)} ${(maxy-miny).toFixed(0)}" width="${(maxx-minx).toFixed(0)}" height="${(maxy-miny).toFixed(0)}">${out}</svg>`,
        w:Math.round(maxx-minx),h:Math.round(maxy-miny),T,labels};
    }
  };
  return api;
}

  animate(anim);apply();
}
function animate(on){stage.classList.toggle("anim",!!on);if(on)setTimeout(()=>stage.classList.remove("anim"),400);}

  else if(P.size===2&&pinch){const [a,b]=[...P.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;moved+=20;
    const pmx=mx-(cur.x-prev.x)/2,pmy=my-(cur.y-prev.y)/2;V.x+=mx-pmx;V.y+=my-pmy;
    zoomAt(mx,my,d/pinch.d);pinch.d=d;}
});
function up(e){
  if(!P.has(e.pointerId))return;P.delete(e.pointerId);if(P.size<2)pinch=null;
  if(e.type==="pointerup"&&moved<6&&e.target.closest&&!e.target.closest(".mk,.zlabel,.zp")){
    const now=Date.now();if(now-lastTap<300){zoomAt(e.clientX,e.clientY,2);lastTap=0;}else lastTap=now;
  }
}
addEventListener("pointerup",up);addEventListener("pointercancel",up);
map.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0018));},{passive:false});
addEventListener("resize",()=>fit(false));

/* ---------- render ---------- */
const MODEL={};
const pageY=y=>.076+y*.7999;
function model(z){if(!MODEL[z]){
  if(z==="yard")MODEL[z]=ISO.yard();
  else{const fac=ITEMS.filter(i=>i.zone==="warehouse"&&["ST","OS","HT","PK","HC"].includes(i.code)).map(i=>({x:i.x,y:pageY(i.y)}));MODEL[z]=ISO.warehouse(RACKS,fac);}
}return MODEL[z];}
function posOf(it){if(mode==="sat")return model(zone).T(it.x,pageY(it.y),0);return [it.x*V.W,it.y*V.H];}
function render(){
  const Z=ZONES[zone];stage.innerHTML="";
  const iso=mode==="sat";stage.classList.toggle("iso",iso);
  if(iso){const m=model(zone);V.W=m.w;V.H=m.h;stage.style.width=V.W+"px";stage.style.height=V.H+"px";
    stage.insertAdjacentHTML("beforeend",m.svg.replace("<svg ",'<svg class="model" '));
    m.labels.forEach(l=>{const p=m.T(l.x,l.y,l.z);const b=document.createElement(l.go?"button":"span");b.className="blabel"+(l.go?" go":"")+(l.minor?" minor":"");
      b.style.left=p[0]+"px";b.style.top=p[1]+"px";b.textContent=l.text[lang];
      if(l.go)b.onclick=()=>{if(moved<6)go(l.go)};stage.appendChild(b);});
  } else {
    V.W=DIM.plan[0];V.H=DIM.plan[1];stage.style.width=V.W+"px";stage.style.height=V.H+"px";
    const img=new Image();img.className="base plan";img.alt="";img.src=IMG[Z.plan];img.draggable=false;stage.appendChild(img);
    const lines=zone==="yard"?ISO.YARD_ROADS:ISO.WALKWAY,col=zone==="yard"?"#8A9198":"#3FAE62",w=zone==="yard"?20:13;
    const pl=r=>r.map(p=>(p[0]*1407).toFixed(1)+","+((p[1]-.076)/.7999*1591).toFixed(1)).join(" ");
    stage.insertAdjacentHTML("beforeend",`<svg class="model" viewBox="0 0 1407 1591" style="opacity:.55">${lines.map(r=>`<polyline points="${pl(r)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`).join("")}</svg>`);
  }
  const frag=document.createDocumentFragment();
  ITEMS.filter(it=>it.zone===zone).forEach(it=>{
    const b=document.createElement("button");b.className="mk";b.dataset.c=it.c;b.dataset.id=it.id;
    const p=posOf(it);b.style.left=p[0]+"px";b.style.top=p[1]+"px";
    b.setAttribute("aria-label",(lang==="ar"?it.ar:it.en)+" "+it.code);
    b.innerHTML=signHTML(it);
    b.addEventListener("click",()=>{if(moved<6)select(it,false)});
    frag.appendChild(b);
  });
  stage.appendChild(frag);
  fit(false);applyFilter();markSel();
}
function applyFilter(){stage.querySelectorAll(".mk").forEach(m=>m.classList.toggle("dim",cat!=="all"&&m.dataset.c!==cat));}
function markSel(){stage.querySelectorAll(".mk").forEach(m=>m.classList.toggle("sel",!!selected&&m.dataset.id===selected.id));}

function chrome(){
  const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $("#t-title").textContent=t.title;$("#t-sub").textContent=t.sub;$("#q").placeholder=t.q;
  $("#b-lang").textContent=t.lang;$("#v-plan").textContent=t.plan;$("#v-sat").textContent=t.sat;
  $("#sh-prev").textContent=t.prev;$("#sh-next").textContent=t.next;$("#sh-zoom").textContent=t.zoom;
  $("#tabs").innerHTML=Object.entries(ZONES).map(([k,z])=>`<button role="tab" data-z="${k}" aria-selected="${k===zone}">${z[lang]}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.z));
  $("#viewseg").style.display="flex";$("#b-tour-t").textContent=t.tour;$("#gt-prev").textContent=t.prev;$("#gt-next").textContent=t.next;
  $("#viewseg").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===mode));
  const chips=$("#chips"),hint=$("#hint");
  {
    hint.style.display="none";chips.style.display="flex";
    const inz=ITEMS.filter(i=>i.zone===zone);const counts={};inz.forEach(i=>counts[i.c]=(counts[i.c]||0)+1);
    let h=`<button class="chip" data-c="all" aria-pressed="${cat==="all"}">${t.all} <b>${inz.length}</b></button>`;
    Object.keys(CATS).filter(c=>counts[c]).forEach(c=>{
      h+=`<button class="chip" data-c="${c}" aria-pressed="${cat===c}"><span class="chipicon"><span class="mk" data-c="${c}">${signHTML({c,code:c==="gate"?"M":"",})}</span></span>${CATS[c][lang]} <b>${counts[c]}</b></button>`;});
    chips.innerHTML=h;
    chips.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;if(selected&&cat!=="all"&&selected.c!==cat)closeSheet();chrome();applyFilter();});
  }
  // place float above panel
  requestAnimationFrame(()=>{const p=$("#panel").getBoundingClientRect();$("#float").style.bottom=(innerHeight-p.top+10)+"px";});
}

function go(z,keepSel){
  if(!ZONES[z])z="yard";
  if(zone!==z){zone=z;cat="all";if(!keepSel)closeSheet(true);}
  if(location.hash.slice(1)!==z)history.replaceState(null,"","#"+z);
  chrome();requestAnimationFrame(render);
}
addEventListener("hashchange",()=>go(location.hash.slice(1)||"yard"));

/* ---------- item sheet ---------- */
function peers(it){return ITEMS.filter(i=>i.zone===it.zone&&i.c===it.c).sort(natural);}
function select(it,doFocus=true){
  selected=it;const t=T[lang];
  if(zone!==it.zone){zone=it.zone;cat="all";history.replaceState(null,"","#"+zone);chrome();render();}
  if(cat!=="all"&&cat!==it.c){cat="all";chrome();applyFilter();}
  markSel();
  $("#sh-sign").innerHTML=`<span class="mk" data-c="${it.c}">${signHTML(it)}</span>`;
  $("#sh-ar").textContent=`${it.ar} ${it.code}`;
  $("#sh-en").textContent=`${it.en} ${it.code}`;
  $("#sh-meta").innerHTML=`<span class="tag code">${it.code}</span><span class="tag">${ZONES[it.zone].ar} / ${ZONES[it.zone].en}</span><span class="tag">${CATS[it.c][lang]}</span>${it.loc?`<span class="tag loc">📍 ${it.loc}${it.locen&&it.locen!==it.loc?` / ${it.locen}`:""}</span>`:""}`;
  const ps=peers(it),i=ps.findIndex(p=>p.id===it.id);
  $("#sh-count").textContent=t.of(i+1,ps.length);
  $("#sh-prev").disabled=i<=0;$("#sh-next").disabled=i>=ps.length-1;
  $("#sheet").classList.add("on");$("#panel").style.visibility="hidden";$("#float").style.visibility="hidden";
  if(doFocus)focusItem(it);
}
function closeSheet(silent){selected=null;$("#sheet").classList.remove("on");$("#panel").style.visibility="";$("#float").style.visibility="";if(!silent)markSel();}
$("#sh-close").onclick=()=>closeSheet();
$("#sh-zoom").onclick=()=>selected&&focusItem(selected);
$("#sh-prev").onclick=()=>{const ps=peers(selected),i=ps.findIndex(p=>p.id===selected.id);if(i>0)select(ps[i-1]);};
$("#sh-next").onclick=()=>{const ps=peers(selected),i=ps.findIndex(p=>p.id===selected.id);if(i<ps.length-1)select(ps[i+1]);};

/* ---------- search ---------- */
const AR_DIG="٠١٢٣٤٥٦٧٨٩";
function norm(s){return s.replace(/[٠-٩]/g,d=>AR_DIG.indexOf(d)).toLowerCase().replace(/[\s.()\-–]+/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه");}
ITEMS.forEach(it=>it.key=norm(it.key));
function search(){
  const raw=$("#q").value,q=norm(raw),ul=$("#results");$("#searchbox").classList.toggle("has",!!raw);
  if(!q){ul.classList.remove("on");ul.innerHTML="";return;}
  const res=ITEMS.filter(it=>it.key.includes(q)).sort((a,b)=>{const ac=norm(a.code)===q?0:1,bc=norm(b.code)===q?0:1;return ac-bc||a.zone.localeCompare(b.zone)||natural(a,b);}).slice(0,30);
  ul.classList.add("on");
  if(!res.length){ul.innerHTML=`<li class="empty">${T[lang].empty}</li>`;return;}
  ul.innerHTML=res.map(it=>`<li><button data-id="${it.id}"><span class="chipicon"><span class="mk" data-c="${it.c}">${signHTML(it)}</span></span><span><span class="t">${lang==="ar"?it.ar:it.en} <bdi>${it.code}</bdi></span><br><span class="z">${ZONES[it.zone][lang]}</span></span></button></li>`).join("");
  ul.querySelectorAll("button").forEach(b=>b.onclick=()=>{const it=ITEMS.find(i=>i.id===b.dataset.id);$("#q").value="";search();$("#q").blur();select(it);});
}
$("#q").addEventListener("input",search);
$("#q-clr").onclick=()=>{$("#q").value="";search();};

/* ---------- tools ---------- */
$("#viewseg").querySelectorAll("button").forEach(b=>b.onclick=()=>{mode=b.dataset.v;closeSheet(true);chrome();render();});
$("#b-fit").onclick=()=>fit(true);
$("#b-lang").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("hsemap.lang",lang)}catch(e){}
  const s=selected;chrome();render();if(s)select(s,false);};
$("#b-theme").onclick=()=>{const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("hsemap.theme",r.dataset.theme)}catch(e){}};
addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

/* guided tour of the 3D model */
const GT={
 yard:[
  {k:1.2,ar:"الساحة الخارجية للمستودع",en:"Outdoor warehouse yard"},
  {x:.37,y:.53,k:3,ar:"البوابة الرئيسية وغرفة التفتيش",en:"Main gate and inspection booth"},
  {x:.27,y:.4,k:3,ar:"نقطة التجمع الخارجية",en:"External assembly point"},

  {x:.432,y:.34,k:2.6,ar:"المستودع المسقوف",en:"Roofed warehouse"},
  {x:.61,y:.2,k:2.8,ar:"المظلات والأرفف",en:"Shelters and racks"},
  {x:.604,y:.455,k:3.4,ar:"نقطة التجمع الداخلية",en:"Internal assembly point"},
  {x:.56,y:.64,k:2.6,ar:"ساحة تخزين المواد وطرق المعدات",en:"Material storage yard and equipment lanes"},
  {x:.77,y:.4,k:2.8,ar:"منطقة تخزين المواد",en:"Material storage area"},
  {x:.58,y:.775,k:3,ar:"مجاري تصريف مياه الأمطار",en:"Rainwater drainage channels"},
  {x:.81,y:.72,k:2.8,ar:"المظلات الشرقية",en:"East shelters"},
  {x:.76,y:.12,k:3.2,ar:"المستودع الكيميائي",en:"Chemical warehouse"}],
 warehouse:[
  {k:1.2,ar:"المستودع المسقوف من الداخل",en:"Inside the roofed warehouse"},
  {x:.47,y:.79,k:3,ar:"البوابة الرئيسية M1 ولوحة الإنذار",en:"Main gate M1 and alarm panel"},
  {x:.3,y:.745,k:3,ar:"غرف الكاميرات والاجتماعات ومكتب المدير",en:"Camera, meeting and manager rooms"},
  {x:.6,y:.745,k:3,ar:"معرض السلامة",en:"Safety exhibition"},
  {x:.73,y:.66,k:3,ar:"العدد والنقالات والقاطع الرئيسي",en:"Tools, stretchers and main switch"},
  {x:.49,y:.63,k:2.6,ar:"الساحة الوسطى",en:"Central area"},
  {x:.5,y:.36,k:2.2,ar:"صفوف الأرفف",en:"Rack rows"},
  {x:.224,y:.33,k:2.8,ar:"ممر المشاة",en:"Pedestrian walkway"},
  {x:.47,y:.12,k:3,ar:"البوابة M2 ومخرج الطوارئ EX3",en:"Gate M2 and emergency exit EX3"},
  {x:.72,y:.16,k:3,ar:"وحدات التكييف",en:"Air conditioning units"}]
};
let gt=null;
function gtShow(i){const steps=GT[zone];gt.i=(i+steps.length)%steps.length;const st=steps[gt.i],t=T[lang];
  $("#gt-ar").textContent=lang==="ar"?st.ar:st.en;$("#gt-en").textContent=lang==="ar"?st.en:st.ar;
  $("#gt-n").textContent=t.of(gt.i+1,steps.length);$("#gt-bar").style.width=((gt.i+1)/steps.length*100)+"%";
  const a=area();stage.classList.add("slow");
  if(st.x==null){V.s=V.fit*st.k;V.x=(a.l+a.r)/2-V.W*V.s/2;V.y=(a.t+a.b)/2-V.H*V.s/2;}
  else{const p=model(zone).T(st.x,st.y,0);V.s=Math.min(V.max,V.fit*st.k);V.x=(a.l+a.r)/2-p[0]*V.s;V.y=(a.t+a.b)/2-p[1]*V.s;}
  apply();clearTimeout(gt.tm);if(gt.play)gt.tm=setTimeout(()=>gtShow(gt.i+1),4200);}
function gtStart(){closeSheet(true);if(mode!=="sat"){mode="sat";chrome();render();}
  gt={i:0,play:true,tm:0};document.body.classList.add("touring");$("#gtcard").hidden=false;$("#gt-pp").innerHTML=PAUSE;gtShow(0);}
function gtStop(){if(!gt)return;clearTimeout(gt.tm);gt=null;document.body.classList.remove("touring");$("#gtcard").hidden=true;stage.classList.remove("slow");fit(true);}
const PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>',PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
$("#b-tour").onclick=gtStart;
$("#gt-x").onclick=gtStop;
$("#gt-next").onclick=()=>gt&&gtShow(gt.i+1);
$("#gt-prev").onclick=()=>gt&&gtShow(gt.i-1);
$("#gt-pp").onclick=()=>{if(!gt)return;gt.play=!gt.play;$("#gt-pp").innerHTML=gt.play?PAUSE:PLAY;if(gt.play)gtShow(gt.i+1);else clearTimeout(gt.tm);};
map.addEventListener("pointerdown",()=>{if(gt&&gt.play){gt.play=false;clearTimeout(gt.tm);$("#gt-pp").innerHTML=PLAY;}stage.classList.remove("slow");});
addEventListener("keydown",e=>{if(e.key==="Escape")gtStop();});

/* attribution position */
function placeAttrib(){}
addEventListener("resize",placeAttrib);

go(location.hash.slice(1)||"yard");
setTimeout(placeAttrib,50);
</script>
